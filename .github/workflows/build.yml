name: Android-App bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Treckit-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK als Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Treckit.apk
          gh release create "build-${{ github.run_number }}" Treckit.apk --title "Treck.it Android, Build ${{ github.run_number }}" --notes "Treckit.apk herunterladen und auf dem Handy öffnen." --latest
